
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Dessert Staff</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#392f2a;font-family:Arial,sans-serif}
header{background:#fff9f5;border-bottom:1px solid #edddd1;padding:16px}
.header{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:20px;font-weight:900}
.subtitle{font-size:11px;color:#a38979;margin-top:5px}
.language{display:flex;gap:5px;background:#f6e9e1;padding:4px;border-radius:30px}
.language button{background:transparent;border:0;padding:8px;color:#9b705d}
.language button.active{background:#d36a53;color:#fff}
button{border:0;border-radius:11px;padding:12px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
main{max-width:850px;margin:auto;padding:16px}
.tabs{display:flex;gap:9px;margin-bottom:18px}
.tabs button{flex:1;background:#f4e6dc;color:#a06953}
.tabs button.active{background:#d36a53;color:white}
.card{background:#fffaf6;border:1px solid #efdfd4;border-radius:17px;padding:17px;margin-bottom:15px}
h2{font-size:21px}
.clock{font-size:clamp(30px,7vw,48px);font-weight:900;color:#ce6851;text-align:center;font-variant-numeric:tabular-nums;margin:15px 0 8px}
.date{text-align:center;color:#9b8478;font-size:12px;margin-bottom:20px}
.camera{border:2px dashed #e6c7b4;background:#fff;border-radius:14px;min-height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;overflow:hidden;padding:12px}
video,img.preview{width:100%;max-height:280px;object-fit:contain;border-radius:10px}
.cameraIcon{font-size:40px}
.primary{width:100%;background:#d36a53;color:#fff;margin-top:12px}
.secondary{width:100%;background:#f1ded1;color:#875742;margin-top:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.in{background:#52947b;color:#fff}
.out{background:#d36a53;color:#fff}
.status{text-align:center;color:#997c6d;font-size:12px;margin-top:15px}
.hidden{display:none!important}
.monthNav{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:14px}
.monthNav button{background:#f3e4d8;color:#a05c44}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:12px 6px;border-bottom:1px solid #ebded4;text-align:left;white-space:nowrap}
th{background:#fff1e8;color:#94796a}
.right{text-align:right}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:#f8e8db;border-radius:12px;padding:13px 5px;text-align:center;font-size:11px;color:#946b55}
.summary strong{display:block;color:#ba5e46;font-size:18px;margin-top:8px}
.note{font-size:11px;color:#a18b7e;text-align:center;margin:13px}
.error{background:#ffeae5;color:#ae493a;padding:12px;border-radius:10px;margin-bottom:12px}
@media(max-width:550px){
main{padding:12px}
.card{padding:13px}
.logo{font-size:17px}
th,td{font-size:10px;padding:10px 4px}
.summary strong{font-size:15px}
}
</style>
</head>
<body>

<header>
<div class="header">
<div>
<div class="logo">🍮 LUCKY DESSERT</div>
<div class="subtitle" data-en="STAFF ATTENDANCE" data-zh="员工打卡系统">STAFF ATTENDANCE</div>
</div>
<div class="language">
<button id="en" class="active" onclick="language('en')">EN</button>
<button id="zh" onclick="language('zh')">中文</button>
</div>
</div>
</header>

<main>
<div class="tabs">
<button id="homeTab" class="active" onclick="page('home')" data-en="📸 Attendance" data-zh="📸 打卡">📸 Attendance</button>
<button id="recordTab" onclick="page('records')" data-en="🗓 My Records" data-zh="🗓 我的记录">🗓 My Records</button>
</div>

<div id="error" class="error hidden"></div>

<section id="home">
<h2 data-en="Welcome! 🧁" data-zh="欢迎回来！🧁">Welcome! 🧁</h2>
<div class="card">
<div class="clock" id="clock">--:--:-- --</div>
<div class="date" id="date"></div>

<div class="camera">
<div id="placeholder" style="text-align:center">
<div class="cameraIcon">📸</div>
<div data-en="Live Camera Attendance" data-zh="实时相机打卡">Live Camera Attendance</div>
</div>
<video id="video" autoplay playsinline muted class="hidden"></video>
<img id="preview" class="preview hidden" alt="Live photo">
</div>

<button class="secondary" id="openButton" onclick="openCamera()" data-en="📷 Open Camera" data-zh="📷 打开相机">📷 Open Camera</button>
<button class="primary hidden" id="photoButton" onclick="takePhoto()" data-en="📸 Take Photo" data-zh="📸 拍照确认">📸 Take Photo</button>

<div class="actions">
<button class="in" onclick="attendance('in')" id="checkIn" data-en="Check In" data-zh="上班打卡">Check In</button>
<button class="out" onclick="attendance('out')" id="checkOut" data-en="Check Out" data-zh="下班打卡">Check Out</button>
</div>
<div class="status" id="status"></div>
</div>
<div class="note" id="demoNote">DEMO MODE · Records saved on this device only</div>
</section>

<section id="records" class="hidden">
<h2 data-en="My Records" data-zh="我的记录">My Records</h2>
<div class="card">
<div class="monthNav">
<button onclick="changeMonth(-1)">❮</button>
<strong id="month"></strong>
<button onclick="changeMonth(1)">❯</button>
</div>
<div class="tableWrap">
<table>
<thead>
<tr>
<th data-en="Date" data-zh="日期">Date</th>
<th>Check In</th>
<th>Check Out</th>
<th class="right" data-en="Hours" data-zh="工时">Hours</th>
<th class="right" data-en="Salary" data-zh="工资">Salary</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<div class="card">
<h3 data-en="Monthly Summary" data-zh="本月总结算">Monthly Summary</h3>
<div class="summary">
<div><span data-en="Days" data-zh="打卡天数">Days</span><strong id="days">0</strong></div>
<div><span data-en="Hours" data-zh="总工时">Hours</span><strong id="hours">0h</strong></div>
<div><span data-en="Salary" data-zh="总工资">Salary</span><strong id="salary">RM0.00</strong></div>
</div>
</div>
</section>
</main>


<script>
const API = 'https://lucky-dessert-api.scxj369.workers.dev';
const TZ = 'Asia/Kuala_Lumpur';
const $ = id => document.getElementById(id);

let lang = localStorage.getItem('LD_LANG') || 'en';
let token = sessionStorage.getItem('LD_STAFF_SESSION') || '';
let stream = null;
let photo = null;
let viewing = new Date();
let records = [];
let working = false;
let loaded = false;
let busy = false;
let staffName = '';

function tr(en, zh) {
  return lang === 'zh' ? zh : en;
}

function showError(message) {
  $('error').textContent = message || '';
  $('error').classList.toggle('hidden', !message);
}

function language(l) {
  lang = l;
  localStorage.setItem('LD_LANG', l);

  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.dataset[l];
  });

  $('en').classList.toggle('active', l === 'en');
  $('zh').classList.toggle('active', l === 'zh');

  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';

  $('demoNote').textContent = tr(
    'Attendance connected to Lucky Dessert database',
    '打卡记录已连接 Lucky Dessert 数据库'
  );

  clock();
  status();
  render();
}

function clock() {
  const now = new Date();

  $('clock').textContent = now.toLocaleTimeString('en-US', {
    timeZone: TZ,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  });

  $('date').textContent = now.toLocaleDateString(
    lang === 'zh' ? 'zh-CN' : 'en-MY',
    {
      timeZone: TZ,
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }
  );
}

setInterval(clock, 1000);

function status() {
  $('checkIn').disabled = !loaded || busy || working;
  $('checkOut').disabled = !loaded || busy || !working;

  $('status').textContent = busy
    ? tr('Saving...', '正在保存...')
    : !loaded
      ? tr('Connecting...', '正在连接...')
      : working
        ? tr('🟢 Checked In', '🟢 已上班')
        : tr('Not Checked In', '尚未上班');
}

function page(p) {
  $('home').classList.toggle('hidden', p !== 'home');
  $('records').classList.toggle('hidden', p !== 'records');

  $('homeTab').classList.toggle('active', p === 'home');
  $('recordTab').classList.toggle('active', p === 'records');

  if (p === 'records') {
    stopCamera();
    render();
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  $('video').srcObject = null;
  $('video').classList.add('hidden');
  $('photoButton').classList.add('hidden');
}

async function openCamera() {
  showError('');
  stopCamera();

  photo = null;
  $('preview').classList.add('hidden');

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera unavailable');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user' }
    });

    $('video').srcObject = stream;
    $('video').classList.remove('hidden');

    $('placeholder').classList.add('hidden');
    $('photoButton').classList.remove('hidden');

    await $('video').play();

  } catch (err) {
    stopCamera();
    showError(tr(
      'Cannot open camera. Please allow camera permission.',
      '无法打开相机，请允许相机权限。'
    ));
  }
}

function takePhoto() {
  const video = $('video');

  if (!stream || !video.videoWidth) {
    showError(tr('Camera not ready', '相机尚未准备好'));
    return;
  }

  const canvas = document.createElement('canvas');
  const scale = Math.min(
    1,
    900 / Math.max(video.videoWidth, video.videoHeight)
  );

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  canvas.getContext('2d').drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  photo = canvas.toDataURL('image/jpeg', 0.72);

  $('preview').src = photo;
  $('preview').classList.remove('hidden');
  $('placeholder').classList.add('hidden');

  stopCamera();
}

function resetPhoto() {
  stopCamera();

  photo = null;
  $('preview').src = '';
  $('preview').classList.add('hidden');
  $('placeholder').classList.remove('hidden');
}

// CLOUDFLARE API CONNECTION

async function requestAPI(path, method = 'GET', body = null) {
  const options = {
    method,
    headers: {
      Authorization: 'Bearer ' + token
    },
    cache: 'no-store'
  };

  if (body !== null) {
    options.headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }

  const response = await fetch(API + path, options);

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error('Invalid server response');
  }

  if (response.status === 401) {
    token = '';
    sessionStorage.removeItem('LD_STAFF_SESSION');
    loaded = false;
    status();
    throw new Error('Session expired. Activate the device again.');
  }

  if (!response.ok || result.success === false) {
    throw new Error(result.error || 'Server error');
  }

  return result;
}

async function activateDevice() {
  const code = prompt(
    'Lucky Dessert Staff\nEnter your private activation code:'
  );

  if (!code) {
    showError('Activation required. Tap the status text to retry.');
    return false;
  }

  try {
    const response = await fetch(API + '/api/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code.trim() })
    });

    const result = await response.json();

    if (!response.ok || !result.token) {
      throw new Error(result.error || 'Activation failed');
    }

    token = result.token;
    sessionStorage.setItem('LD_STAFF_SESSION', token);
    return true;

  } catch (err) {
    showError(err.message);
    return false;
  }
}

// LOAD REAL DATA FROM GOOGLE SHEETS

async function loadHome() {
  busy = true;
  status();
  showError('');

  try {
    const result = await requestAPI('/api/home');

    const data = result.data;

    staffName = data.staff.name;
    records = data.records || [];
    working = Boolean(data.working);
    loaded = true;

    const today = data.now.date.split('-');

    viewing = new Date(
      Number(today[0]),
      Number(today[1]) - 1,
      1
    );

    const heading = document.querySelector('#home h2');
    heading.removeAttribute('data-en');
    heading.removeAttribute('data-zh');
    heading.textContent = 'Hello, ' + staffName + '! 🧁';

    render();

  } catch (err) {
    loaded = false;
    showError(err.message);

  } finally {
    busy = false;
    status();
  }
}

// SAVE REAL ATTENDANCE

async function attendance(action) {
  if (!loaded || busy) return;

  if (!photo) {
    showError(tr(
      'Please take a live photo first.',
      '请先实时拍照。'
    ));
    return;
  }

  busy = true;
  status();
  showError('');

  try {
    const result = await requestAPI(
      '/api/attendance',
      'POST',
      {
        action: action === 'in' ? 'checkin' : 'checkout',
        photo
      }
    );

    const data = result.data;

    working = Boolean(data.working);
    records = data.records || [];

    resetPhoto();
    render();

    alert(tr(
      action === 'in'
        ? 'Check In Successful!'
        : 'Check Out Successful!',
      action === 'in'
        ? '上班打卡成功！'
        : '下班打卡成功！'
    ));

  } catch (err) {
    showError(err.message);

  } finally {
    busy = false;
    status();
  }
}

// DAILY RECORDS

function money(value) {
  return 'RM' + Number(value || 0).toFixed(2);
}

function changeMonth(n) {
  viewing = new Date(
    viewing.getFullYear(),
    viewing.getMonth() + n,
    1
  );

  render();
}

function render() {
  const month =
    viewing.getFullYear() + '-' +
    String(viewing.getMonth() + 1).padStart(2, '0');

  $('month').textContent = lang === 'zh'
    ? viewing.getFullYear() + '年' +
      (viewing.getMonth() + 1) + '月'
    : viewing.toLocaleDateString('en-US', {
        month: 'long',
        year: 'numeric'
      });

  const list = records.filter(
    r => r.date.startsWith(month)
  );

  let totalHours = 0;
  let totalSalary = 0;

  $('rows').replaceChildren();

  if (!list.length) {
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.colSpan = 5;
    cell.textContent = tr('No records', '没有记录');
    row.appendChild(cell);
    $('rows').appendChild(row);
  }

  list.forEach(r => {
    totalHours += Number(r.hours || 0);
    totalSalary += Number(r.salary || 0);

    const row = document.createElement('tr');

    const values = [
      r.date.slice(5) + (r.incomplete ? ' *' : ''),
      r.checkIn,
      r.checkOut,
      Number(r.hours || 0).toFixed(2) + 'h',
      money(r.salary)
    ];

    values.forEach((value, index) => {
      const cell = document.createElement('td');
      cell.textContent = value;

      if (index >= 3) cell.className = 'right';

      row.appendChild(cell);
    });

    $('rows').appendChild(row);
  });

  $('days').textContent = list.length;
  $('hours').textContent = totalHours.toFixed(2) + 'h';
  $('salary').textContent = money(totalSalary);
}

// START APP

async function startApp() {
  clock();
  status();

  if (!token) {
    const activated = await activateDevice();
    if (!activated) return;
  }

  await loadHome();
}

// Retry activation if needed.
$('status').addEventListener('click', async () => {
  if (loaded || busy) return;

  if (!token) {
    const activated = await activateDevice();
    if (!activated) return;
  }

  await loadHome();
});

window.addEventListener('pagehide', stopCamera);

language(lang);
startApp();
</script>

</body>
</html>
